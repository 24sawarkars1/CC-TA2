AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TA-2 - Event-driven serverless file processing.
  S3 (ObjectCreated) -> Lambda (private subnet) -> SNS email alert.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that will receive the SNS notifications
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: Must be a valid email address
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24

Resources:
  # ------------------------------------------------------------------
  # Networking
  # ------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true      # DNS Resolution
      EnableDnsHostnames: true    # DNS Hostnames
      Tags:
        - { Key: Name, Value: ta2-vpc }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: ta2-igw }

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: ta2-public-subnet }

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: ta2-private-subnet }

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: ta2-nat-eip }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet      # NAT lives in the PUBLIC subnet
      Tags:
        - { Key: Name, Value: ta2-nat }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: ta2-public-rt }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: ta2-private-rt }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway    # outbound internet via NAT

  PrivateRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # (Optional) S3 Gateway endpoint: private path to S3, no internet needed
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda ENI security group (outbound only)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: ta2-lambda-sg }

  # ------------------------------------------------------------------
  # Messaging (SNS)
  # ------------------------------------------------------------------
  FileProcessingAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts
      DisplayName: File Processing Alerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FileProcessingAlerts
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ------------------------------------------------------------------
  # IAM role for Lambda
  # ------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3AndSNSAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::ta2-file-processing-${AWS::AccountId}-${AWS::Region}/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FileProcessingAlerts

  # ------------------------------------------------------------------
  # Lambda (in private subnet)
  # ------------------------------------------------------------------
  ProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ta2-file-processor
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TOPIC_ARN: !Ref FileProcessingAlerts
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")
          TOPIC_ARN = os.environ["TOPIC_ARN"]


          def handler(event, context):
              results = []
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

                  # Safety net: never process our own output
                  if key.startswith("processed/"):
                      continue

                  head = s3.head_object(Bucket=bucket, Key=key)
                  metadata = {
                      "bucket": bucket,
                      "key": key,
                      "size_bytes": head["ContentLength"],
                      "content_type": head.get("ContentType"),
                      "etag": head.get("ETag"),
                      "event_name": record.get("eventName"),
                      "processed_at": datetime.now(timezone.utc).isoformat(),
                      "request_id": context.aws_request_id,
                  }

                  out_key = "processed/" + key.split("/")[-1] + ".metadata.json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=out_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json",
                  )

                  sns.publish(
                      TopicArn=TOPIC_ARN,
                      Subject="File processed: " + key.split("/")[-1],
                      Message=(
                          "File processed successfully.\n\n"
                          f"Bucket : {bucket}\n"
                          f"Key    : {key}\n"
                          f"Size   : {metadata['size_bytes']} bytes\n"
                          f"Log    : s3://{bucket}/{out_key}\n"
                          f"Time   : {metadata['processed_at']}\n"
                      ),
                  )
                  results.append(out_key)

              print(json.dumps({"processed": results}))
              return {"statusCode": 200, "processed": results}

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ta2-file-processor
      RetentionInDays: 7

  # Resource-based policy: lets S3 invoke the function
  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessingLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::ta2-file-processing-${AWS::AccountId}-${AWS::Region}

  # ------------------------------------------------------------------
  # Storage (S3)
  # The bucket name is built with !Sub (not !Ref) on purpose, so the
  # Lambda/permission/role don't depend on the bucket and we avoid a
  # circular dependency (bucket notification -> Lambda -> bucket).
  # ------------------------------------------------------------------
  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeLambdaPermission
    Properties:
      BucketName: !Sub ta2-file-processing-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256      # SSE-S3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ProcessingLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/   # output goes to processed/ -> no infinite loop

Outputs:
  BucketName:
    Value: !Ref FileBucket
  LambdaName:
    Value: !Ref ProcessingLambda
  TopicArn:
    Value: !Ref FileProcessingAlerts
  VpcId:
    Value: !Ref VPC
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
  PublicSubnetId:
    Value: !Ref PublicSubnet
